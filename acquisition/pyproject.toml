[project]
name = "music-acquisition"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "beets>=2,<3", "numpy>=2,<3", "yt-dlp[default]", "pyyaml>=6,<7", "essentia-tensorflow==2.1b6.dev1389; python_version == '3.11'"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
