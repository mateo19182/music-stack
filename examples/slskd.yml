remote_configuration: true
remote_file_management: true
directories:
  incomplete: /data/downloads/slskd-incomplete
  downloads: /data/downloads/slskd
shares:
  directories:
  - /data/shared
  filters: []
  cache:
    retention: 1440
web:
  port: 5030
  https:
    disabled: true
  authentication:
    username: CHANGE_ME_ADMIN_USERNAME
    password: CHANGE_ME_ADMIN_PASSWORD
    api_keys:
      soularr:
        key: CHANGE_ME_API_KEY
        role: administrator
        cidr: 0.0.0.0/0,::/0
soulseek:
  username: CHANGE_ME_SOULSEEK_USERNAME
  password: CHANGE_ME_SOULSEEK_PASSWORD
  listen_port: 50000
transfers:
  download:
    # each file waiting in an uploader's queue holds a slot; too few and new requests time out locally
    slots: 500
    speed_limit: 1000000   # KB/s, effectively none
  upload:
    # home line: ~16 Mbit/s up (2026-10-10); Soulseek + torrents stay near 60% of it
    slots: 6
    speed_limit: 800
retention:
  # minutes; finished downloads stay a week so a retried job finds them, failures go after a day
  transfers:
    download:
      succeeded: 10080
      errored: 1440
      cancelled: 60
    upload:
      succeeded: 1440
      errored: 1440
      cancelled: 60
