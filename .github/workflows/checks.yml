name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libchromaprint-tools
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r acquisition/requirements.lock
          python -m pip install pytest==9.1.1
      - name: Backend tests
        run: PYTHONPATH=acquisition pytest -q acquisition/tests
      - name: Frontend syntax
        run: node --check acquisition/app/static/app.js
