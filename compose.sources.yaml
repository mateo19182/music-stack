services:
  slskd:
    image: slskd/slskd:0.26.1@sha256:588af49abc3088d639c8f1174d3bfad6e92c093a275a593140e3ac9311ebf6c4
    container_name: slskd
    user: 1000:1000
    environment:
      TZ: Europe/Madrid
      SLSKD_REMOTE_CONFIGURATION: 'true'
    volumes:
    - ${SLSKD_STATE_DIR:-./config/slskd}:/app
    - ${MUSIC_DATA_ROOT:-/mnt/data/music-library}:/data
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
  deemix:
    image: ghcr.io/bambanah/deemix@sha256:1fa4bdf600d40337abe30d970cfdd4e1a48cac5614742c2f577c3ac5f7092c34
    container_name: deemix
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
      DEEMIX_SINGLE_USER: 'true'
      DEEMIX_MUSIC_DIR: /downloads
    volumes:
    - ${DEEMIX_STATE_DIR:-./config/deemix}:/config
    - ${MUSIC_DATA_ROOT:-/mnt/data/music-library}/downloads/deemix:/downloads
    restart: unless-stopped
  deemix-web:
    image: nginx@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    container_name: deemix-web
    volumes:
    - ${DEEMIX_PROXY_CONF:-./deployment/deemix-proxy.conf}:/etc/nginx/conf.d/default.conf:ro
    - ${DEEMIX_HTPASSWD_FILE:-./config/deemix/htpasswd}:/etc/nginx/htpasswd:ro
    ports:
    - 127.0.0.1:6595:80
    - 127.0.0.1:8687:81
    depends_on:
    - deemix
    restart: unless-stopped
  beets:
    image: lscr.io/linuxserver/beets@sha256:99582f104d04241b46a4a7071d424d0529800f9e3d04baa36db47b5e8cda6e96
    profiles:
    - tools
    user: 1000:1000
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
    volumes:
    - ${BEETS_STATE_DIR:-./config/beets}:/config
    - ${MUSIC_DATA_ROOT:-/mnt/data/music-library}:/data
    restart: 'no'
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent@sha256:b522f9f4b769f8f36d49d22d5eb6a92e9aa18904c6a1830b1439df511ec21983
    container_name: qbittorrent
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
      WEBUI_PORT: '8091'
    volumes:
    - ${QBITTORRENT_STATE_DIR:-./config/qbittorrent}:/config
    - ${MUSIC_DATA_ROOT:-/mnt/data/music-library}/downloads/torrents:/downloads/torrents
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:f9151e5bc1025c6d0a630d503210cdcb6bb55a7cc098562609d96a408d838902
    container_name: prowlarr
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Madrid
    volumes:
    - ${PROWLARR_STATE_DIR:-./config/prowlarr}:/config
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    environment:
      TZ: Europe/Madrid
      LOG_LEVEL: info
    restart: unless-stopped
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
  gluetun:
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: slskd-vpn
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun
    env_file:
    - ${AIRVPN_ENV_FILE:-./config/airvpn/airvpn.env}
    environment:
      TZ: Europe/Madrid
      VPN_SERVICE_PROVIDER: airvpn
      VPN_TYPE: wireguard
      FIREWALL_INPUT_PORTS: '5030,8091,9696'
    volumes:
    - ${GLUETUN_STATE_DIR:-./config/airvpn/gluetun}:/gluetun
    ports:
    - 127.0.0.1:5030:5030
    - 127.0.0.1:8091:8091
    - 127.0.0.1:9696:9696
    networks:
      default:
        aliases:
        - slskd
        - qbittorrent
        - prowlarr
    restart: unless-stopped
name: lidarr
networks:
  default:
    name: ${SOURCE_NETWORK:-lidarr_default}
